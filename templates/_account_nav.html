{% if current_user %}
  <a class="topbar-link topbar-bell" href="{{ url_for('notifications') }}" id="topbar-bell"
     data-poll="{{ url_for('notifications_poll') }}" data-latest="{{ latest_alert or 0 }}"
     title="Notifications" aria-label="Notifications{% if unread_alerts %}, {{ unread_alerts }} unread{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
    <span class="topbar-badge" {% if not unread_alerts %}hidden{% endif %}>{{ unread_alerts if unread_alerts < 100 else "99+" }}</span>
  </a>
  <a class="topbar-link topbar-user" href="{{ url_for('account') }}" title="Your account">{{ current_user.username }}</a>
  <form class="topbar-logout" action="{{ url_for('logout') }}" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <button class="topbar-link" type="submit">Log out</button>
  </form>
  <script src="{{ url_for('static', filename='notify.js') }}" defer></script>
{% endif %}

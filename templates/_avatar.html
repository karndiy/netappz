{# A profile photo, or a coloured initial for people without one. #}
{% macro avatar(name, file, size="") -%}
  {%- if file -%}
    <img class="avatar {{ size }}" src="{{ url_for('avatar_image', name=file) }}" alt="" loading="lazy">
  {%- else -%}
    <span class="avatar {{ size }}" style="--hue: {{ name | hue }}" aria-hidden="true">{{ name[:1] | upper }}</span>
  {%- endif -%}
{%- endmacro %}

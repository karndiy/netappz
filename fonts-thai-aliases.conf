  <alias binding="same"><family>TH SarabunPSK</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>TH Sarabun PSK</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>Sarabun</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>Angsana New</family><prefer><family>Kinnari</family></prefer></alias>
  <alias binding="same"><family>AngsanaUPC</family><prefer><family>Kinnari</family></prefer></alias>
  <alias binding="same"><family>Cordia New</family><prefer><family>Garuda</family></prefer></alias>
  <alias binding="same"><family>CordiaUPC</family><prefer><family>Garuda</family></prefer></alias>
  <alias binding="same"><family>Browallia New</family><prefer><family>Garuda</family></prefer></alias>
  <alias binding="same"><family>BrowalliaUPC</family><prefer><family>Garuda</family></prefer></alias>
  <alias binding="same"><family>Leelawadee UI</family><prefer><family>Loma</family></prefer></alias>
  <alias binding="same"><family>Leelawadee</family><prefer><family>Loma</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Loma</family></prefer></alias>
</fontconfig>

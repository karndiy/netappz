# Version 2.4 supports "depends_on: condition: service_healthy" on docker-compose 1.x.
version: "2.4"

# Cap each container's log at 3 files of 10 MB, so logs can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build: .
    image: network-files
    container_name: network-files
    ports:
      # Port 80 lets LAN devices open http://netappz.local without typing a port.
      - "80:5000"
      - "5000:5000"
    environment:
      # Set a fixed value so sessions survive restarts (optional).
      FILES_SECRET_KEY: ${FILES_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-notes}:${POSTGRES_PASSWORD:-notes}@db:5432/${POSTGRES_DB:-notes}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./shared:/data/shared
      # Photos and videos posted on the Feed.
      - feedmedia:/data/feed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  # Telegram bot for chatting with the AI from anywhere. It only connects out
  # to Telegram (long polling), so no ports are opened. Idle until a token is set.
  telegram:
    image: network-files
    container_name: network-files-telegram
    command: ["python", "telegram_bot.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-notes}:${POSTGRES_PASSWORD:-notes}@db:5432/${POSTGRES_DB:-notes}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  # Alpine (musl) images avoid the clone3 seccomp issue on Docker 19.03.
  db:
    image: postgres:16-alpine
    container_name: network-files-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes}
      POSTGRES_DB: ${POSTGRES_DB:-notes}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # A new, empty database loads the newest dump from ./backups on first start.
      - ./backups:/backups:ro
      - ./scripts/db-init-restore.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    healthcheck:
      # TCP, not the socket: during first-start setup and restore Postgres listens on the
      # socket only, so the app waits until the restore has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  # Dumps the database to ./backups on the host (outside Docker) at start and every
  # BACKUP_INTERVAL_HOURS. Restore with scripts/db-restore.sh.
  backup:
    image: postgres:16-alpine
    container_name: network-files-backup
    entrypoint: ["sh", "/db-backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-notes}
      PGPASSWORD: ${POSTGRES_PASSWORD:-notes}
      PGDATABASE: ${POSTGRES_DB:-notes}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: network-files-redis
    # Sessions and the notes cache: every key expires, so when the 64 MB limit is reached
    # Redis drops the least recently used expiring keys. The append-only file alone keeps
    # sessions across restarts (RDB snapshots are off, so data is written once).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  feedmedia:
